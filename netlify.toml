# Netlify derleme ayarları. Arayüzdeki "Build settings" yerine bunlar kullanılır;
# böylece site hangi Netlify hesabına bağlanırsa bağlansın aynı şekilde derlenir.
# Netlify, Next.js projesini tanıyıp .next çıktısını sunucu fonksiyonlarına çevirir.
# Ortam değişkenleri (Supabase, VAPID, CRON_SECRET) burada değil, Netlify
# arayüzünde tanımlanır; derlemeden önce eklenmiş olmalıdır.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next.js çalışma zamanı: .next çıktısını sunucu fonksiyonlarına ve yönlendirme
# kurallarına çevirir. Yeni bağlanan hesaplarda otomatik kurulmayabildiği için
# açıkça belirtilir; yoksa .next ham dosya olarak yayınlanır ve her sayfa 404 verir.
[[plugins]]
  package = "@netlify/plugin-nextjs"
