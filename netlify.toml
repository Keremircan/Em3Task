# Netlify derleme ayarları. Arayüzdeki "Build settings" yerine bunlar kullanılır;
# böylece site hangi Netlify hesabına bağlanırsa bağlansın aynı şekilde derlenir.
# Ortam değişkenleri (Supabase, VAPID, CRON_SECRET) burada değil, Netlify
# arayüzünde tanımlanır; derlemeden önce eklenmiş olmalıdır.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# .next çıktısını sunucu fonksiyonlarına çeviren Next.js eklentisi. Netlify bunu
# sadece site oluşturulurken Next.js'i tanırsa kendiliğinden ekliyor; elle oluşturulup
# sonra GitHub'a bağlanan sitede eklenmiyor ve .next düz dosya olarak yayınlanıyordu.
# Sürüm package.json'da (devDependencies) sabit.
[[plugins]]
  package = "@netlify/plugin-nextjs"
